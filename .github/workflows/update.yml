name: Update DNS rules
on:
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rules/**', 'scripts/**', 'tests/**', 'build.sh', '.github/workflows/update.yml']
  pull_request:
    paths: ['rules/**', 'scripts/**', 'tests/**', 'build.sh', '.github/workflows/update.yml']
permissions:
  contents: read
concurrency:
  group: dns-rules-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash build.sh test
  update:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash build.sh update
      - name: Publish validated rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add filters/dns.txt filters/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated DNS rules'
            git push
          fi
          bash build.sh pages-build
